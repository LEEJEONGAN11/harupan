<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>하루판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --head:oklch(0.33 0.065 165);
  --head-2:oklch(0.41 0.075 165);
  --head-mute:oklch(0.89 0.035 165);
  --ground:#fff;
  --panel:oklch(0.966 0.007 165);
  --panel-2:oklch(0.935 0.011 165);
  --ink:oklch(0.2 0.015 165);
  --ink-2:oklch(0.4 0.015 165);
  --ink-3:oklch(0.52 0.012 165);
  --line:oklch(0.9 0.006 165);
  --line-2:oklch(0.8 0.01 165);
  --go:oklch(0.43 0.09 165);
  --go-bg:oklch(0.95 0.03 165);
  --red:oklch(0.52 0.2 27);
  --red-bg:oklch(0.96 0.025 27);
  --sat:oklch(0.5 0.15 258);
}
.k-blue{--c:oklch(0.52 0.14 255)}.k-orange{--c:oklch(0.62 0.14 55)}.k-plum{--c:oklch(0.52 0.14 330)}.k-teal{--c:oklch(0.58 0.1 205)}.k-olive{--c:oklch(0.58 0.11 115)}.k-slate{--c:oklch(0.5 0.03 255)}.k-none{--c:oklch(0.6 0.012 165)}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-padding-top:5rem}
body{margin:0;background:var(--ground);color:var(--ink);font:400 1rem/1.5 "SUIT Variable",SUIT,"Malgun Gothic",system-ui,sans-serif;word-break:keep-all;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:oklch(0.88 0.06 165);color:var(--ink)}
:focus-visible{outline:2px solid var(--go);outline-offset:2px;border-radius:4px}
h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.i{width:1.125rem;height:1.125rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bar{background:var(--head);color:#fff;position:sticky;top:0;z-index:10}
.bar-in{max-width:80rem;margin:0 auto;padding:0 2rem;height:3.75rem;display:flex;align-items:center;gap:2rem}
.brand{font-size:1.1875rem;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;align-self:stretch;gap:.25rem}
.tabs a{display:flex;align-items:center;padding:0 .875rem;color:var(--head-mute);font-weight:700;border-bottom:3px solid transparent;border-top:3px solid transparent;transition:color .16s,background-color .16s}
.tabs a:hover{color:#fff;background:var(--head-2)}
.tabs a[aria-current]{color:#fff;border-bottom-color:#fff}
.tabs .n{margin-left:.375rem;font-size:.75rem;font-weight:700;background:oklch(1 0 0 / .18);color:#fff;padding:.0625rem .4375rem;border-radius:999px}
.quick{position:relative;margin-left:auto;display:flex;gap:.5rem;flex:0 1 26rem}
.quick input{flex:1;min-width:0;height:2.375rem;padding:0 .75rem;border:1px solid transparent;border-radius:6px;background:#fff;color:var(--ink)}
.quick input::placeholder{color:var(--ink-3)}
.quick input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn{height:2.375rem;padding:0 1.125rem;border:1px solid oklch(1 0 0 / .6);border-radius:6px;background:transparent;color:#fff;font-weight:700;cursor:pointer;transition:background-color .16s}
.btn:hover{background:var(--head-2)}
.btn:active{background:oklch(0.28 0.06 165)}
.btn:focus-visible{outline-color:#fff}
.hint{position:absolute;top:calc(100% + .5rem);left:0;right:0;z-index:20;background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:.5rem;box-shadow:0 10px 28px oklch(0.2 0.02 165 / .18)}
.hint p{font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:.25rem .5rem .375rem}
.hint button{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;border:0;background:none;padding:.5rem;border-radius:6px;text-align:left;cursor:pointer;font-size:.9375rem;font-weight:600}
.hint button:hover{background:var(--panel)}
.hint button span{color:var(--go);font-weight:700;font-size:.8125rem;white-space:nowrap}

.page{max-width:80rem;margin:0 auto;padding:2rem 2rem 3rem}
.view{display:grid;grid-template-columns:minmax(0,1fr) 24rem;gap:3rem;align-items:start}
.view.one{grid-template-columns:minmax(0,46rem)}
.view.full{grid-template-columns:minmax(0,1fr)}
.main{min-width:0}
.side{background:var(--panel);border-radius:12px;padding:1.5rem;position:sticky;top:5.25rem;max-height:calc(100vh - 6.5rem);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.banner{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;background:oklch(0.965 0.03 90);border:1px solid oklch(0.86 0.06 90);border-radius:10px;padding:.625rem 1rem;margin-bottom:1.5rem;font-weight:600;font-size:.9375rem}
.locked .bar,.locked .page{display:none}
.gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--panel)}
.gate-in{width:min(24rem,100%);background:#fff;border-radius:14px;padding:2rem;box-shadow:0 12px 36px oklch(0.2 0.02 165 / .12);display:grid;gap:.5rem}
.gate-in h1{color:var(--head)}
.gate-in p{color:var(--ink-2);font-weight:500;margin-bottom:.75rem}
.gate-in label{font-size:.875rem;font-weight:700}
.gate-in input{height:2.75rem;padding:0 .75rem;border:1px solid var(--line-2);border-radius:6px;font-size:1rem}
.gate-in .err{margin:0}
.gate-in .btn-p{height:2.75rem;margin-top:.5rem}
.gate-in .btn-p:disabled{background:var(--ink-3);cursor:default}
.foot i.wait{background:oklch(0.75 0.14 85)}
.foot .more{margin:0 0 0 .25rem}
.banner.warn{background:var(--red-bg);border-color:oklch(0.82 0.08 27)}
.acts .icx{margin:0 -.375rem 0 0}
.first{border:1px solid var(--line-2);border-radius:12px;padding:1.5rem;margin-bottom:2rem}
.first p{color:var(--ink-2);font-weight:500;margin:.375rem 0 1rem;max-width:38rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.875rem;color:var(--ink-2);font-weight:500}
.foot span{display:flex;align-items:center;gap:.5rem}
.foot i{width:.5rem;height:.5rem;border-radius:50%;background:oklch(0.62 0.15 155)}
.foot i.off{background:var(--red)}
.foot a{font-weight:700;color:var(--go);padding:.25rem .5rem;margin-right:-.5rem;border-radius:6px;transition:background-color .16s}
.foot a:hover{background:var(--panel)}

.vh{margin-bottom:1.75rem}
.vh-r{display:flex;align-items:center;justify-content:space-between;gap:.75rem 1rem;flex-wrap:wrap}
h1{font-size:1.625rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.asof{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.say{margin-top:.5rem;max-width:44rem;color:var(--ink-2);font-weight:500;text-wrap:pretty}
.say > span{display:block}
.say a,.say b{color:var(--ink);font-weight:800}
.say a{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.2em;text-decoration-color:var(--line-2);transition:text-decoration-color .16s}
.say a:hover{text-decoration-color:currentColor}
.say a.late{color:var(--red);text-decoration-color:oklch(0.82 0.09 27)}
.ctl{display:flex;align-items:center;gap:.5rem}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.5rem;align-items:start}
.stack{display:grid;gap:2.5rem;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--ink)}
h2{font-size:1.125rem;font-weight:800;letter-spacing:-.01em}
.sec-h .n{font-size:.875rem;font-weight:700;color:var(--ink-2)}
.sec-h .n.late{color:var(--red)}
.sec + .sec{margin-top:2.5rem}
.stack > .sec,.two > .sec{margin-top:0}

.row{display:flex;align-items:flex-start;gap:.75rem;padding:.6875rem 0;border-bottom:1px solid var(--line)}
.row .tm{flex:none;width:3.25rem;font-weight:700}
.row .tm.wide{width:3.75rem;color:var(--ink-2)}
.row .tm.ck{display:flex}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.row .m{display:flex;flex-wrap:wrap;align-items:center;gap:.125rem .75rem;font-size:.875rem;font-weight:500;color:var(--ink-2);margin-top:.125rem}
.row .late{color:var(--red);font-weight:700}
.row .must{color:var(--ink);font-weight:700}
.row.done .tm,.row.done b{color:var(--ink-3);font-weight:500}
.row.done label b{text-decoration:line-through;text-decoration-color:var(--line-2)}
.row.next{background:var(--go-bg);margin:0 -.75rem;padding-left:.75rem;padding-right:.75rem;border-radius:8px;border-bottom-color:transparent}
.row.next .st{color:var(--go);font-weight:700}
.row input[type=checkbox]{width:1.25rem;height:1.25rem;margin:.125rem 0 0;accent-color:var(--head);cursor:pointer;flex:none}
.row label{cursor:pointer}
.row > .ic{color:var(--ink-2);margin-top:.1875rem}
.row.ed{border-bottom:0;padding:.5rem 0}
.tag{display:inline-flex;align-items:center;gap:.375rem;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:.625rem;height:.625rem;border-radius:3px;background:var(--c)}
.empty{padding:1rem 0;color:var(--ink-2);font-size:.9375rem;font-weight:500;border-bottom:1px solid var(--line)}
.grp{font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:1rem 0 .3125rem;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:.375rem;flex:none;align-items:center}
.act,.keep{height:1.9375rem;font-size:.875rem;font-weight:700;color:var(--go);background:#fff;border:1px solid oklch(0.78 0.05 165);padding:0 .625rem;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background-color .16s}
.keep{padding:0 .25rem;max-width:5.25rem}
.act:hover,.keep:hover{background:var(--go-bg)}
.act:active{background:oklch(0.91 0.045 165)}
.icx{flex:none;width:2rem;height:2rem;display:inline-grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--ink-3);cursor:pointer;margin:-.125rem -.375rem 0 0;transition:background-color .16s,color .16s}
.icx:hover{background:var(--panel-2);color:var(--ink)}
.icx .i{width:1rem;height:1rem}
.lk{border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer;color:inherit;display:block;width:100%}
.lk:hover b{text-decoration:underline;text-underline-offset:.2em}
.addrow{display:flex;gap:.5rem;padding:.625rem 0 0}
.addrow input{flex:1;min-width:0}

.side-h{font-size:1.125rem;font-weight:800;margin-bottom:.25rem}
.sub-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-bottom:.375rem;border-bottom:2px solid var(--ink);margin-top:1.5rem}
h3{font-size:.9375rem;font-weight:800}
.side .row,.side .empty{border-bottom-color:oklch(0.87 0.009 165)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.more{font-size:.875rem;font-weight:700;color:var(--go);padding:.25rem .5rem;margin-right:-.5rem;border:0;background:none;border-radius:6px;cursor:pointer;transition:background-color .16s}
.more:hover{background:var(--panel-2)}

.icb{width:2.25rem;height:2.25rem;display:inline-grid;place-items:center;border:1px solid var(--line-2);background:#fff;border-radius:6px;color:var(--ink-2);cursor:pointer;transition:background-color .16s,color .16s}
.icb:hover{background:var(--panel);color:var(--ink)}
.icb.txt{width:auto;padding:0 .875rem;font-size:.875rem;font-weight:700}
.icb.sm{width:2rem;height:2rem}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:#fff}
.seg button{height:2.25rem;padding:0 .875rem;border:0;border-left:1px solid var(--line-2);background:none;font-size:.875rem;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background-color .16s}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--panel)}
.seg button[aria-pressed=true]{background:var(--head);color:#fff}
.seg.full{display:flex}
.seg.full button{flex:1;height:2.5rem}

.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th{font-size:.8125rem;font-weight:700;color:var(--ink-2);text-align:center;padding:.375rem 0}
.grid th:first-child,.grid td.sun{color:var(--red)}
.grid th:last-child,.grid td.sat{color:var(--sat)}
.grid td{padding:0;vertical-align:top}
.grid td button{display:flex;flex-direction:column;align-items:center;width:100%;min-height:2.875rem;border:0;background:none;padding:.25rem 0 .375rem;border-radius:8px;cursor:pointer;font-weight:700;color:inherit;transition:background-color .16s}
.grid td button:hover{background:var(--panel-2)}
.grid .dn{display:flex;align-items:center;gap:.25rem}
.grid .d{display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;font-size:.9375rem}
.grid td.today .d{background:var(--head);color:#fff}
.grid td.sel button{box-shadow:inset 0 0 0 2px var(--ink)}
.grid small{font-size:.75rem;font-weight:700}
.mini small{display:none}
.mini td.sel.today button{box-shadow:none}
.dots{display:flex;gap:3px;height:.375rem;margin-top:.125rem}
.dots i{width:.375rem;height:.375rem;border-radius:50%;background:var(--c)}
.dots i.tk{background:none;border:1.5px solid var(--ink-3);border-radius:2px}
.evs{display:none}
.big{border-top:2px solid var(--ink)}
.big th{text-align:left;padding:.5rem}
.big td{height:6.875rem;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.big td:first-child{border-left:0}
.big td button{align-items:stretch;height:100%;min-height:6.875rem;padding:.375rem;border-radius:0;text-align:left}
.big td button:hover{background:var(--panel)}
.big .dots{display:none}
.big .evs{display:block;min-width:0;margin-top:.125rem}
.evs em{display:block;font-style:normal;font-size:.8125rem;font-weight:700;line-height:1.35;padding:.125rem .375rem;border-radius:4px;margin-top:.1875rem;background:color-mix(in oklch,var(--c) 15%,white);color:color-mix(in oklch,var(--c) 62%,black);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evs em.tk{background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.evs u{display:block;text-decoration:none;font-size:.8125rem;font-weight:700;color:var(--ink-2);margin:.1875rem 0 0 .375rem}

.wk{border-top:2px solid var(--ink)}
.wk-h,.wk-a,.wk-b{display:grid;grid-template-columns:3rem repeat(7,minmax(0,1fr))}
.wk-h button{display:flex;flex-direction:column;align-items:center;gap:.125rem;border:0;background:none;padding:.5rem 0;cursor:pointer;font-size:.8125rem;font-weight:700;color:var(--ink-2);transition:background-color .16s}
.wk-h button:hover{background:var(--panel)}
.wk-h button b{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;font-size:1rem;color:var(--ink)}
.wk-h .sun,.wk-h .sun b{color:var(--red)}
.wk-h .sat,.wk-h .sat b{color:var(--sat)}
.wk-h .today b{background:var(--head);color:#fff}
.wk-h .sel{box-shadow:inset 0 -3px 0 var(--ink)}
.wk-a{border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-height:2rem}
.wk-a > span{font-size:.8125rem;font-weight:600;color:var(--ink-2);padding-top:.375rem}
.wk-a > div{border-left:1px solid var(--line);padding:0 3px 3px;min-width:0}
.wk-a .evs{display:block}
.wk-a .evs button{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.wk-b{height:40.5rem}
.wk-t span{display:block;height:2.25rem;font-size:.8125rem;font-weight:600;color:var(--ink-2);padding-top:.125rem}
.wk-c{position:relative;border-left:1px solid var(--line);cursor:cell;background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 2.25rem)}
.wk-c.today{background-color:var(--panel)}
.wk-e{position:absolute;left:3px;right:3px;top:calc((var(--s) - 6) * 2.25rem + 1px);height:calc((var(--e) - var(--s)) * 2.25rem - 2px);min-height:1.25rem;padding:.125rem .375rem;border-radius:4px;overflow:hidden;font-size:.8125rem;line-height:1.3;text-align:left;cursor:pointer;background:color-mix(in oklch,var(--c) 16%,white);border:1px solid color-mix(in oklch,var(--c) 45%,white);color:color-mix(in oklch,var(--c) 62%,black)}
.wk-e b{display:block;font-weight:800}
.wk-e span{font-weight:600}
.wk-now{position:absolute;left:0;right:0;top:calc((var(--s) - 6) * 2.25rem);height:2px;background:var(--red);pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}

.f{display:grid;gap:.875rem}
.f label,.f .lab,.editor label,.editor .lab{display:block;font-size:.875rem;font-weight:700;margin-bottom:.3125rem}
.f input:not([type=checkbox]),.f select,.f textarea,.editor input,.editor select,.tool input,.addrow input,.set input,.set select{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid var(--line-2);border-radius:6px;background:#fff;transition:border-color .16s}
.f textarea{height:6.5rem;padding:.625rem .75rem;resize:vertical;line-height:1.5}
.f ::placeholder,.tool ::placeholder,.addrow ::placeholder,.set ::placeholder{color:var(--ink-3)}
.f input:hover,.f select:hover,.f textarea:hover,.tool input:hover,.addrow input:hover,.editor input:hover,.editor select:hover{border-color:var(--ink-3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.err{color:var(--red);font-size:.875rem;font-weight:600;margin-top:.3125rem}
.help{font-size:.875rem;font-weight:500;color:var(--ink-2);margin-top:.4375rem}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn-p{height:2.5rem;padding:0 1.125rem;border:0;border-radius:6px;background:var(--head);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap;transition:background-color .16s}
.btn-p:hover{background:var(--head-2)}
.btn-p:active{background:oklch(0.28 0.06 165)}
.btn-o{height:2.5rem;padding:0 1rem;border:1px solid var(--line-2);border-radius:6px;background:#fff;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;transition:background-color .16s}
.btn-o:hover{background:var(--panel-2)}
.btn-d{height:2.5rem;padding:0 .75rem;border:0;background:none;color:var(--red);font-weight:700;border-radius:6px;cursor:pointer;margin-left:auto;transition:background-color .16s}
.btn-d:hover{background:var(--red-bg)}
.editor{display:grid;gap:.625rem;width:100%;background:var(--panel);border-radius:8px;padding:.875rem}
.presets{display:flex;gap:.375rem;margin-bottom:.4375rem}
.presets button,.chips button{display:inline-flex;align-items:center;gap:.375rem;height:2rem;padding:0 .75rem;border:1px solid var(--line-2);border-radius:999px;background:#fff;font-size:.875rem;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background-color .16s}
.presets button:hover,.chips button:hover{background:var(--panel)}
.presets button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}
.days button{height:2.375rem;border:1px solid var(--line-2);border-radius:6px;background:#fff;font-size:.875rem;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background-color .16s}
.days button[aria-pressed=true]{background:var(--head);border-color:var(--head);color:#fff}

.rt{width:100%;border-collapse:collapse}
.rt th{font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:.625rem 0 .4375rem;text-align:center;width:2.5rem}
.rt th.l,.rt td.l{text-align:left;width:auto}
.rt th.tm,.rt td.tm{width:4.5rem;text-align:left}
.rt th.st,.rt td.st{width:4rem;text-align:right}
.rt th.ed,.rt td.ed{width:2.25rem;text-align:right}
.rt th.sun{color:var(--red)}.rt th.sat{color:var(--sat)}
.rt th.on{color:var(--ink);font-weight:800}
.rt td{padding:.5rem 0;border-bottom:1px solid var(--line);text-align:center}
.rt td.l{font-weight:600;overflow-wrap:anywhere}
.rt td.tm{color:var(--ink-2);font-weight:500;font-size:.9375rem}
.rt td.st{font-weight:700}
.rt td.st.zero{color:var(--ink-3);font-weight:500}
.rt .on{background:var(--panel)}
.rt .icx{margin:0}

<script>
(()=>{
'use strict';
const QS=new URLSearchParams(location.search);
const KEY='harupan.v1'+(QS.get('test')?'.test.'+QS.get('test'):'');
const FAKE=QS.get('now')?new Date(QS.get('now')):null;
const WD=['일','월','화','수','목','금','토'];
const PAL={blue:'파랑',orange:'주황',plum:'자주',teal:'청록',olive:'연두',slate:'회색'};
const KIND={link:'링크',note:'메모',file:'파일'};
const H0=6,H1=24;
const HOL26={'01-01':'신정','02-16':'설날 연휴','02-17':'설날','02-18':'설날 연휴','03-01':'삼일절','03-02':'대체공휴일','05-05':'어린이날','05-24':'부처님오신날','05-25':'대체공휴일','06-06':'현충일','08-15':'광복절','08-17':'대체공휴일','09-24':'추석 연휴','09-25':'추석','09-26':'추석 연휴','10-03':'개천절','10-05':'대체공휴일','10-09':'한글날','12-25':'성탄절'};
const HOLF={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const now=()=>FAKE?new Date(FAKE):new Date();
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const valid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(pd(s))===s;
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>pd(s).getDay();
const today=()=>ymd(now());
const nowH=()=>{const d=now();return d.getHours()+d.getMinutes()/60};
const md=s=>{const d=pd(s);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const mdw=s=>`${md(s)} ${WD[dow(s)]}요일`;
const wk0=s=>add(s,-dow(s));
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const hm=t=>{const a=t.split(':').map(Number);return a[0]+a[1]/60};
const t12=t=>{const a=t.split(':').map(Number);return `${a[0]<12?'오전':'오후'} ${a[0]%12||12}시${a[1]?` ${a[1]}분`:''}`};
const mAdd=(ym,n)=>{const a=ym.split('-').map(Number),d=new Date(a[0],a[1]-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const mTitle=ym=>`${+ym.slice(0,4)}년 ${+ym.slice(5)}월`;
const hol=s=>(s.slice(0,4)==='2026'?HOL26:HOLF)[s.slice(5)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- 구글 시트 연결 ----------
   SYNC_URL이 비어 있으면 이 기기에만 저장한다. 주소가 있으면 입장 비밀번호를 넣은 기기만 시트의 내용을 읽고 쓴다.
   합치기: 마지막으로 시트와 맞춘 사본(base)과 비교해서, 이 기기에서 안 고친 것은 시트 쪽을 따르고 고친 것은 이 기기 것을 남긴다. */
const SYNC_URL='https://script.google.com/macros/s/AKfycbxHfI8VXHkirmiBD9EHXlL-XaDfz_IqsiaKMVj-3GpIEV41Pq3PcwpxiXVdTXtOxx0Hfg/exec';

const J=x=>x===undefined?'':JSON.stringify(x);
const pick3=(b,l,r)=>J(l)===J(b)?r:l;
function mergeList(b,l,r,k){
  const bm=new Map(b.map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),out=[],seen=new Set();
  const one=id=>{
    const B=bm.get(id),L=lm.get(id),R=rm.get(id);
    if(J(L)===J(B))return R;
    if(J(R)===J(B))return L;
    if(L===undefined)return R;
    if(R===undefined)return L;
    if(k==='rt'){const m=JSON.parse(JSON.stringify(L));m.log={};new Set([...Object.keys(B&&B.log||{}),...Object.keys(L.log||{}),...Object.keys(R.log||{})]).forEach(d=>{if(pick3(B&&B.log&&B.log[d],L.log&&L.log[d],R.log&&R.log[d]))m.log[d]=1});return m}
    return L;
  };
  l.forEach(x=>{seen.add(x.id);const v=one(x.id);if(v)out.push(v)});
  r.forEach(x=>{if(seen.has(x.id))return;seen.add(x.id);const v=one(x.id);if(v)out.push(v)});
  return out;
}
function merge3(b,l,r){
  const o=blank();
  ['cats','ev','td','rt','it','fold'].forEach(k=>{o[k]=mergeList(b[k]||[],l[k]||[],r[k]||[],k)});
  o.memo={};
  new Set([...Object.keys(b.memo||{}),...Object.keys(l.memo||{}),...Object.keys(r.memo||{})]).forEach(k=>{const v=pick3((b.memo||{})[k],(l.memo||{})[k],(r.memo||{})[k]);if(v!==undefined)o.memo[k]=v});
  o.demo=!!pick3(b.demo,l.demo,r.demo);
  return o;
}

  else if(SY.dirty||SY.busy)el.innerHTML='<i class="wait"></i>구글 시트에 저장하는 중';

function lock(msg){

function takeRemote(r){
  if(!r.exists){SY.dirty=true;return}
  if(r.at===SY.at)return;
  const remote=Object.assign(blank(),JSON.parse(r.json)),base=getBase();
  if(SY.dirty||!base){S=merge3(base||blank(),S,remote);SY.dirty=JSON.stringify(S)!==JSON.stringify(remote)}
  else S=remote;
  SY.at=r.at;saveLocal();saveMeta();if(!SY.dirty)setBase(JSON.stringify(S));
}
async function pull(){
  if(!SY.on||!SY.key||SY.busy)return;
  SY.busy=true;status();
  try{
    const r=await api({action:'get',name:'main',key:SY.key});
    if(!r.ok){if(r.error==='auth'){SY.busy=false;lock('비밀번호가 바뀌었습니다. 새 비밀번호를 넣어 주세요.');return}throw new Error(r.error)}
    const before=SY.at;takeRemote(r);SY.err='';
    if(SY.at!==before&&!typing())render();
  }catch(e){SY.err='net'}
  SY.busy=false;
  if(SY.dirty&&!SY.err)push();else status();
}
function queue(){if(!SY.on||!SY.key)return;SY.dirty=true;saveMeta();status();clearTimeout(SY.t);SY.t=setTimeout(push,1500)}
async function push(){
  if(!SY.on||!SY.key)return;
  clearTimeout(SY.t);
  if(SY.busy){SY.t=setTimeout(push,700);return}
  SY.busy=true;status();
  const json=JSON.stringify(S),at=Date.now();let again=false;
  try{
    const r=await api({action:'set',name:'main',key:SY.key,json,at,rev:1,expect:SY.at});
    if(r.ok){SY.at=at;SY.dirty=JSON.stringify(S)!==json;setBase(json);SY.err='';savedAt=now()}
    else if(r.error==='conflict')again=true;
    else if(r.error==='auth'){SY.busy=false;lock('비밀번호가 바뀌었습니다. 새 비밀번호를 넣어 주세요.');return}
    else throw new Error(r.error);
  }catch(e){SY.err='net'}
  SY.busy=false;saveMeta();
  if(again){await pull();return}
  status();
  if(SY.dirty&&!SY.err)SY.t=setTimeout(push,1500);
}
function flush(){
  if(!SY.on||!SY.key||!SY.dirty||!navigator.sendBeacon)return;
  clearTimeout(SY.t);
  try{navigator.sendBeacon(SURL,new Blob([JSON.stringify({action:'set',name:'main',key:SY.key,json:JSON.stringify(S),at:Date.now(),rev:1,expect:SY.at})],{type:'text/plain;charset=utf-8'}))}catch(e){}
}

/* ---------- 한 줄 넣기를 일정·할 일·루틴·자료로 나누기 ---------- */
function ptime(s){
  let m=s.match(/(\d{1,2}):(\d{2})/);
  if(m&&+m[1]<24&&+m[2]<60)return {t:`${pad(+m[1])}:${m[2]}`,src:m[0]};
  m=s.match(/(오전|오후|아침|낮|저녁|밤|새벽)?\s*(\d{1,2})시(?:\s*(\d{1,2})분|\s*(반))?/);
  if(!m)return null;
  let h=+m[2];const ap=m[1];
  if(h>24)return null;
  if(ap==='오후'||ap==='저녁'||ap==='낮'){if(h<12)h+=12}else if(ap==='밤'){if(h>=6&&h<12)h+=12}else if(!ap&&h>=1&&h<=6)h+=12;
  if(h===24)h=0;
  return {t:`${pad(h)}:${pad(m[3]?Math.min(59,+m[3]):m[4]?30:0)}`,src:m[0]};
}
function pdate(s){
  const T=today(),t=pd(T);let m;
  if((m=s.match(/(\d+)일\s*(뒤|후)/)))return {d:add(T,+m[1]),src:m[0]};
  const rel={오늘:0,내일:1,모레:2,글피:3};
  if((m=s.match(/(오늘|내일|모레|글피)(?=\s|$|까지|에|은|는|도|부터|중|밤|아침|저녁|낮|오전|오후|\d)/)))return {d:add(T,rel[m[1]]),src:m[1]};

  if((m=s.match(/(\d{1,2})월\s*(\d{1,2})일/))){
    let d=`${t.getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`;
    if(valid(d)){if(diff(T,d)>60)d=`${t.getFullYear()+1}${d.slice(4)}`;if(valid(d))return {d,src:m[0]}}
  }
  if((m=s.match(/(\d{1,2})일(?!\s*(?:동안|간|째|치))/))){
    let ym=T.slice(0,7),d=`${ym}-${pad(+m[1])}`;
    if(valid(d)&&d<T){ym=mAdd(ym,1);d=`${ym}-${pad(+m[1])}`}
    if(valid(d))return {d,src:m[0]};
  }
  if((m=s.match(/(이번\s*주|다음\s*주)?\s*([일월화수목금토])요일/))){
    let n=WD.indexOf(m[2])-dow(T);
    if(m[1]&&/다음/.test(m[1]))n+=7;else if(n<0&&!m[1])n+=7;
    return {d:add(T,n),src:m[0]};
  }
  return null;
}
function prep(s){
  let w=null,src='',m;
  if((m=s.match(/(?:매주|일주일에|한\s*주에|(?<!다음|이번|지난)(?:^|\s)주)\s*(\d)\s*(?:회|번)(?:씩)?/))&&+m[1]>=1&&+m[1]<=7)return {w:[1,1,1,1,1,1,1],k:+m[1],src:m[0]};
  if((m=s.match(/매일|날마다/))){w=[1,1,1,1,1,1,1];src=m[0]}
  else if((m=s.match(/평일마다|매주\s*평일/))){w=[0,1,1,1,1,1,0];src=m[0]}
  else if((m=s.match(/주말마다|매주\s*주말/))){w=[1,0,0,0,0,0,1];src=m[0]}
  else if((m=s.match(/매주\s*((?:[일월화수목금토](?:요일|(?=[일월화수목금토])|(?![가-힣]))[,·]?\s?)+)/))||(m=s.match(/(([일월화수목금토])요일)마다/))){
    w=[0,0,0,0,0,0,0];(m[1].replace(/요일/g,'').match(/[일월화수목금토]/g)||[]).forEach(c=>{w[WD.indexOf(c)]=1});src=m[0];
    if(!w.includes(1))w=null;
  }
  return w?{w,src}:null;
}
function parse(raw){
  const s=raw.trim().replace(/\s+/g,' ');
  const url=(s.match(/https?:\/\/\S+|www\.\S+/)||[])[0];
  if(url){const u=/^http/.test(url)?url:'https://'+url,rest=s.replace(url,'').trim();return {type:'it',o:{k:kindOf(u),n:rest||u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60),b:'',url:u,c:''}}}
  const tm=ptime(s);let rp=prep(s),m;
  if(!rp&&tm&&(m=s.match(/^(평일|주말)(에는|에|엔)?(?=\s)/)))rp={w:m[1]==='평일'?[0,1,1,1,1,1,0]:[1,0,0,0,0,0,1],src:m[0]};

  const act=/(기|제출|이체|신청|확인|구매|결제|납부|연락|취소|반납|반품|수령|발송|등록|주문|송금|청소|빨래)$/;
  if(rp&&tm&&rp.w.filter(x=>x).length===1&&/(회의|미팅|약속|수업|모임|상담|레슨|강의|예배|진료)$/.test(n)){const k=rp.w.indexOf(1);return {type:'ev',o:{d:add(today(),(k-dow(today())+7)%7),t:tm.t,e:'',n,c:'',r:'w'}}}
  if(rp)return {type:'rt',o:{n:n||'새 루틴',t:tm?tm.t:'',w:rp.w,k:rp.k||0}};
  if(tm&&until)return {type:'td',o:{n:(n||'새 할 일')+' ('+tm.t+'까지)',due:dt?dt.d:today()}};
  if(tm)return {type:'ev',o:{d:dt?dt.d:today(),t:tm.t,e:'',n:n||'새 일정',c:''}};
  if(dt)return until||act.test(n)?{type:'td',o:{n:n||'새 할 일',due:dt.d}}:{type:'ev',o:{d:dt.d,t:'',e:'',n:n||'새 일정',c:''}};
  if(act.test(s)||/(예약|전화|준비|정리)$/.test(s))return {type:'td',o:{n:s,due:''}};

}

    if(!n){$('#ev-err').hidden=false;$('#ev-n').focus();return}
    if(f.timed&&f.e&&f.e<=f.t){$('#ev-terr').hidden=false;$('#ev-e').focus();return}
    const o={n,d:f.d,t:f.timed?f.t:'',e:f.timed?f.e:'',c:f.c,r:f.r},id=f.id;
    if(!(id&&o.r)){U.sel=f.d;U.cur=f.d.slice(0,7)}U.f.ev=evBlank(U.sel);
    commit(id?'일정을 고쳤습니다':`${md(o.d)}에 일정을 넣었습니다`,()=>{const e=id&&S.ev.find(x=>x.id===id);if(e)Object.assign(e,o);else S.ev.push(Object.assign({id:id||uid()},o))},{focus:id?null:'#ev-n'});
  },
  'rt-save'(){
    syncRt();const f=U.f.rt,n=f.n.trim(),T=today();
    if(!n){$('#rt-err').hidden=false;$('#rt-n').focus();return}
    const k=f.mode==='count'?f.k:0;
    if(!k&&!f.w.includes(1)){$('#rt-derr').hidden=false;return}
    const id=f.id,t=f.timed?f.t:'',w=f.w.slice(),sig=(a,b)=>a+'|'+b.join('');U.f.rt=rtBlank();
    commit(id?'루틴을 고쳤습니다':`루틴을 만들었습니다 · ${k?`주 ${k}회`:wLabel(w)} · ${t||'언제든'}`,()=>{
      const r=id&&S.rt.find(x=>x.id===id);
      if(r){r.n=n;r.t=t;if(sig(r.k||0,r.w)!==sig(k,w)){r.w=w;r.k=k;const last=r.sch[r.sch.length-1];if(last.from===T){last.w=w;last.k=k}else r.sch.push({from:T,w,k})}}
      else S.rt.push({id:uid(),n,t,w,k,from:T,sch:[{from:T,w,k}],log:{}});
    },{focus:id?null:'#rt-n'});
  },
  'it-dlg'(){
    const d=U.d;if(!d)return;
    let n=$('#d-n').value.trim(),f=$('#d-f').value;
    const b=$('#d-b').value.replace(/\s+$/,''),u=$('#d-u').value.trim(),c=$('#d-c').value,fn=$('#d-fn').value.trim();
    if(!n&&b)n=b.split('\n')[0].trim().slice(0,40);
    if(!n&&u)n=u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60);
    if(!n){d.ask=false;$('#d-foot').innerHTML=dlgFoot();$('#d-err').hidden=false;$('#d-n').focus();return}
    const url=u?(/^https?:\/\//.test(u)?u:'https://'+u):'',snap=JSON.stringify(S),id=d.id,old=id?S.it.find(y=>y.id===id):null;
    if(!c)f='';
    else if(f==='+'){const same=foldsOf(c).find(y=>y.n===fn);if(same)f=same.id;else if(fn){const nf={id:uid(),c,n:fn};S.fold.push(nf);f=nf.id}else f=''}
    const o={n,b,url,c,f,k:url?kindOf(url):old?old.k:'note'};
    if(old)Object.assign(old,o);else{const x=Object.assign({id:uid(),d:today()},o);S.it.unshift(x);U.itSel=x.id}
    $('#dlg').close();U.d=null;save();render();
    toast(old?'자료를 고쳤습니다':`자료를 넣었습니다 · ${c?cat(c).n+(fold(f)?' › '+fold(f).n:''):'정리 대기'}`,{undo:snap});
  },
  'fold-add'(){
    const el=$('#fold-n'),n=el.value.trim(),c=cat(U.fc);if(!c)return;if(!n){el.focus();return}
    const same=foldsOf(c.id).find(f=>f.n===n);
    if(same){U.ff=same.id;U.fNew=false;render();toast('같은 이름의 폴더가 이미 있어서 그 폴더를 열었습니다');return}
    const f={id:uid(),c:c.id,n};U.fNew=false;U.ff=f.id;
    commit(`"${n}" 폴더를 만들었습니다`,()=>{S.fold.push(f)});
  },
  'fold-ren'(){
    const el=$('#fold-rn'),n=el.value.trim(),f=fold(U.ff);if(!f)return;if(!n){el.focus();return}
    U.fRen=false;commit('폴더 이름을 바꿨습니다',()=>{f.n=n});
  },
  'memo-save'(){const s=$('#memo-in').value.trim(),k=U.rv;commit(s?'회고를 적어 두었습니다':'회고를 비웠습니다',()=>{if(s)S.memo[k]={s};else delete S.memo[k]})},
  'cat-add'(){const el=$('#cat-add'),n=el.value.trim();if(!n){el.focus();return}const used=S.cats.map(c=>c.col),col=Object.keys(PAL).find(p=>!used.includes(p))||'slate';commit(`"${n}" 분류를 만들었습니다`,()=>{S.cats.push({id:uid(),n,col})},{focus:'#cat-add'})}
};

  K('협력사 주말 작업 계획서 받기','work',-8,-8);K('영어 듣기 목록 만들기','study',-9,-9);K('청소 장비 가격 알아보기','biz',-7,-7);K('주말 작업 보고 양식 정리','work',-6,-6);
  const from=add(T,-24);
  const R=(n,t,w,pat,k)=>{const log={};for(let i=1;i<=24;i++){const d=add(T,-i);if(w[dow(d)]&&pat(i))log[d]=1}const r={id:uid(),n,t,w,k:k||0,from,sch:[{from,w,k:k||0}],log,x};S.rt.push(r);return r};
  const a=R('아침 스트레칭 10분','07:00',[1,1,1,1,1,1,1],i=>i!==13);a.log[T]=1;
  const b=R('영어 20분','08:10',[0,1,1,1,1,1,0],i=>i%6!==0);if(rtDue(b,T))b.log[T]=1;
  R('운동 30분','21:30',[0,1,1,1,1,1,1],i=>i%2===1,3);
  R('가계부 쓰기','',[1,1,1,1,1,1,1],i=>i%3!==1);
  const FD={};
  [['dwg','work','도면'],['wk','work','주말 작업'],['price','biz','견적·단가'],['reg','biz','등록 서류']].forEach(a=>{if(cat(a[1])){FD[a[0]]=uid();S.fold.push({id:FD[a[0]],c:a[1],n:a[2],x})}});
  const I=(k,n,b,c,o,fo)=>S.it.push({id:uid(),k,n,b,url:'',c:cat(c)?c:'',f:cat(c)&&FD[fo]||'',d:add(T,o),x});
  I('file','이번 달 카드 명세서','PDF 1개. 구글 드라이브에 올려 두고 주소를 붙이면 됩니다.','',0);
  I('link','입주청소 단가 비교 글','평수별 단가표가 들어 있는 글.','',-1);
  I('note','세무사 상담 때 물어볼 것','간이과세와 일반과세 차이, 사업자 카드, 초기 장비 비용 처리.','',-1);
  I('file','창호일람표 도면 대조 결과','엑셀 1개. 단위세대와 공용부를 도면과 대조한 결과.','work',-1,'dwg');
  I('link','사업자 등록 절차 안내','등록 순서와 준비 서류를 정리한 안내 글.','biz',-2,'reg');
  I('note','가구 배치 생각','침대 위치, 책상 크기, 수납장 자리.','home',-3);

function unseed(){['ev','td','rt','it','fold'].forEach(k=>{S[k]=S[k].filter(o=>!o.x)});S.it.forEach(o=>{if(o.f&&!fold(o.f))o.f=''});Object.keys(S.memo).forEach(k=>{if(S.memo[k].x)delete S.memo[k]});S.demo=false;U.itSel=null;U.tdEdit=null;U.f.ev=evBlank(U.sel);U.f.rt=rtBlank()}

/* ---------- 연결 ---------- */
document.addEventListener('click',ev=>{
  const lk=ev.target.closest('a[href^="#"]');
  if(lk&&VIEWS.includes(lk.getAttribute('href').slice(1))){ev.preventDefault();go(lk.getAttribute('href').slice(1));return}
  if(lk){const to=document.getElementById(lk.getAttribute('href').slice(1));if(to){ev.preventDefault();to.scrollIntoView({block:'start'})}return}
  const ex=ev.target.closest('[data-ex]');
  if(ex){const q=$('#q');q.value=ex.dataset.ex;$('#hint').hidden=true;q.focus();return}
  const el=ev.target.closest('[data-a]');
  if(!el||el.matches('select,input,textarea'))return;
  const fn=A[el.dataset.a];if(fn)fn(el,ev);
});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.id==='d-c'){$('#d-f').innerHTML=foldOpts(el.value,'');$('#d-fw').hidden=!el.value;$('#d-fn').hidden=true;if(U.d)U.d.dirty=true;return}
  if(el.id==='d-f'){$('#d-fn').hidden=el.value!=='+';if(el.value==='+')$('#d-fn').focus();if(U.d)U.d.dirty=true;return}
  if(el.matches('[data-a]')&&el.matches('select,input')){const fn=A[el.dataset.a];if(fn)fn(el,ev)}});
document.addEventListener('submit',ev=>{const f=ev.target.closest('form[data-f]');if(!f)return;ev.preventDefault();const fn=F[f.dataset.f];if(fn)fn(f)});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.closest('#dlg')){if(U.d)U.d.dirty=true;const e=$('#d-err');if(e)e.hidden=true;return}
  if(t.id==='box-q'){U.fq=t.value.trim();$('#box-list').innerHTML=boxList()}
  else if(t.id==='q')$('#hint').hidden=!!t.value;
  else if(t.id==='ev-n')$('#ev-err').hidden=true;
  else if(t.id==='rt-n')$('#rt-err').hidden=true;
  else if(t.id==='fold-n'||t.id==='fold-rn'){}
  else if(t.id==='ev-e'||t.id==='ev-t'){const e=$('#ev-terr');if(e)e.hidden=true}
});
document.addEventListener('keydown',ev=>{
  if($('#dlg').open){if((ev.ctrlKey||ev.metaKey)&&(ev.key==='Enter'||ev.key==='s'||ev.key==='S')){ev.preventDefault();$('#dlg form').requestSubmit()}return}
  const r=ev.target.closest&&ev.target.closest('tr[data-a]');
  if(r&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();A[r.dataset.a](r,ev);return}
  if(ev.key==='Escape'){if(!$('#hint').hidden){$('#hint').hidden=true;return}if(U.tdEdit){U.tdEdit=null;render();return}}
  if(ev.key==='/'&&!ev.target.matches('input,textarea,select')){ev.preventDefault();$('#q').focus()}
});
$('#dlg').addEventListener('cancel',ev=>{ev.preventDefault();dlgClose(false)});
const Q=$('#q');
Q.addEventListener('focus',()=>{$('#hint').hidden=!!Q.value});
Q.addEventListener('blur',()=>{setTimeout(()=>{const h=$('#hint');if(h&&document.activeElement!==Q)h.hidden=true},180)});
window.addEventListener('hashchange',route);
window.addEventListener('popstate',route);
setInterval(()=>{
  if(document.hidden)return;
  const ae=document.activeElement;
  if(today()===U.day&&now().getMinutes()===U.min)return;
  if(ae&&ae.matches('input,textarea,select')&&ae.id!=='q')return;
  if(today()!==U.day&&U.sel===U.day){U.sel=today();U.cur=U.sel.slice(0,7)}
  render();
},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else pull()});
window.addEventListener('focus',()=>pull());
window.addEventListener('online',()=>pull());
setInterval(()=>{if(!document.hidden)pull()},60000);
if(QS.has('demo')&&!S.ev.length&&!S.td.length&&!S.rt.length&&!S.it.length){seed();save()}
route();
if(SY.on){if(SY.key)pull();else lock()}
})();
