<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07402d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루판">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>하루판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --head:oklch(0.33 0.065 165);
  --head-2:oklch(0.41 0.075 165);
  --head-mute:oklch(0.89 0.035 165);
  --ground:#fff;
  --panel:oklch(0.966 0.007 165);
  --panel-2:oklch(0.935 0.011 165);
  --ink:oklch(0.2 0.015 165);
  --ink-2:oklch(0.4 0.015 165);
  --ink-3:oklch(0.52 0.012 165);
  --line:oklch(0.9 0.006 165);
  --line-2:oklch(0.8 0.01 165);
  --go:oklch(0.43 0.09 165);
  --go-bg:oklch(0.95 0.03 165);
  --red:oklch(0.52 0.2 27);
  --red-bg:oklch(0.96 0.025 27);
  --sat:oklch(0.5 0.15 258);
}
.k-blue{--c:oklch(0.52 0.14 255)}.k-orange{--c:oklch(0.62 0.14 55)}.k-plum{--c:oklch(0.52 0.14 330)}.k-teal{--c:oklch(0.58 0.1 205)}.k-olive{--c:oklch(0.58 0.11 115)}.k-slate{--c:oklch(0.5 0.03 255)}.k-none{--c:oklch(0.6 0.012 165)}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-padding-top:5rem}
body{margin:0;background:var(--ground);color:var(--ink);font:400 1rem/1.5 "SUIT Variable",SUIT,"Malgun Gothic",system-ui,sans-serif;word-break:keep-all;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:oklch(0.88 0.06 165);color:var(--ink)}
:focus-visible{outline:2px solid var(--go);outline-offset:2px;border-radius:4px}
h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
/* 폰에서 화면이 옆으로 밀리지 않게: 무엇이 넘쳐도 가로로는 움직이지 않는다 */
html,body{overflow-x:clip}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#imp{left:0;top:0}
.i{width:1.125rem;height:1.125rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bar{background:var(--head);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
a,button,label,select,input,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bar-in{max-width:80rem;margin:0 auto;padding:0 2rem;height:3.75rem;display:flex;align-items:center;gap:2rem}
.brand{font-size:1.1875rem;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;align-self:stretch;gap:.25rem}
.tabs a{display:flex;align-items:center;padding:0 .875rem;color:var(--head-mute);font-weight:700;border-bottom:3px solid transparent;border-top:3px solid transparent;transition:color .16s,background-color .16s}
.tabs a:hover{color:#fff;background:var(--head-2)}
.tabs a[aria-current]{color:#fff;border-bottom-color:#fff}
.tabs .n{margin-left:.375rem;font-size:.75rem;font-weight:700;background:oklch(1 0 0 / .18);color:#fff;padding:.0625rem .4375rem;border-radius:999px}
.quick{position:relative;margin-left:auto;display:flex;gap:.5rem;flex:0 1 26rem;min-width:0}
.quick input{flex:1 1 0;width:0;min-width:0;height:2.375rem;padding:0 .75rem;border:1px solid transparent;border-radius:6px;background:#fff;color:var(--ink)}
.quick input::placeholder{color:var(--ink-3)}
.quick input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn{height:2.375rem;padding:0 1.125rem;border:1px solid oklch(1 0 0 / .6);border-radius:6px;background:transparent;color:#fff;font-weight:700;cursor:pointer;transition:background-color .16s}
.btn:hover{background:var(--head-2)}
.btn:active{background:oklch(0.28 0.06 165)}
.btn:focus-visible{outline-color:#fff}
.hint{position:absolute;top:calc(100% + .5rem);left:0;right:0;z-index:20;background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:.5rem;box-shadow:0 10px 28px oklch(0.2 0.02 165 / .18)}
.hint p{font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:.25rem .5rem .375rem}
.hint button{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;border:0;background:none;padding:.5rem;border-radius:6px;text-align:left;cursor:pointer;font-size:.9375rem;font-weight:600}
.hint button:hover{background:var(--panel)}
.hint button span{color:var(--go);font-weight:700;font-size:.8125rem;white-space:nowrap}

.page{max-width:80rem;margin:0 auto;padding:2rem 2rem 3rem}
.view{display:grid;grid-template-columns:minmax(0,1fr) 24rem;gap:3rem;align-items:start}
.view.one{grid-template-columns:minmax(0,46rem)}
.view.full{grid-template-columns:minmax(0,1fr)}
.main{min-width:0}
.side{background:var(--panel);border-radius:12px;padding:1.5rem;position:sticky;top:5.25rem;max-height:calc(100vh - 6.5rem);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.banner{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;background:oklch(0.965 0.03 90);border:1px solid oklch(0.86 0.06 90);border-radius:10px;padding:.625rem 1rem;margin-bottom:1.5rem;font-weight:600;font-size:.9375rem}
.locked .bar,.locked .page{display:none}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;padding-top:calc(1.5rem + env(safe-area-inset-top));background:var(--panel)}
.gate::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--head)}
.gate-in{width:min(24rem,100%);background:#fff;border-radius:14px;padding:2rem;box-shadow:0 12px 36px oklch(0.2 0.02 165 / .12);display:grid;gap:.5rem}
.gate-in > div{display:grid;gap:.5rem}
.gate-in .btn-p.big{height:3.25rem;font-size:1.0625rem;margin-top:.75rem}
.gate-in .more{justify-self:center;margin:.5rem 0 0}
.gate-in h1{color:var(--head)}
.gate-in p{color:var(--ink-2);font-weight:500;margin-bottom:.75rem}
.gate-in label{font-size:.875rem;font-weight:700}
.gate-in input{height:2.75rem;padding:0 .75rem;border:1px solid var(--line-2);border-radius:6px;font-size:1rem}
.gate-in .err{margin:0}
.gate-in .btn-p{height:2.75rem;margin-top:.5rem}
.gate-in .btn-p:disabled{background:var(--ink-3);cursor:default}
.foot i.wait{background:oklch(0.75 0.14 85)}
.foot .more{margin:0 0 0 .25rem}
.banner.warn{background:var(--red-bg);border-color:oklch(0.82 0.08 27)}
.acts .icx{margin:0 -.375rem 0 0}
.first{border:1px solid var(--line-2);border-radius:12px;padding:1.5rem;margin-bottom:2rem}
.first p{color:var(--ink-2);font-weight:500;margin:.375rem 0 1rem;max-width:38rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.875rem;color:var(--ink-2);font-weight:500}
.foot span{display:flex;align-items:center;gap:.5rem}
.foot i{width:.5rem;height:.5rem;border-radius:50%;background:oklch(0.62 0.15 155)}
.foot i.off{background:var(--red)}
.foot a{font-weight:700;color:var(--go);padding:.25rem .5rem;margin-right:-.5rem;border-radius:6px;transition:background-color .16s}
.foot a:hover{background:var(--panel)}

.vh{margin-bottom:1.75rem}
.vh-r{display:flex;align-items:center;justify-content:space-between;gap:.75rem 1rem;flex-wrap:wrap}
h1{font-size:1.625rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.asof{font-size:.875rem;font-weight:500;color:var(--ink-2)}
.say{margin-top:.5rem;max-width:44rem;color:var(--ink-2);font-weight:500;text-wrap:pretty}
.say > span{display:block}
.say a,.say b{color:var(--ink);font-weight:800}
.say a{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.2em;text-decoration-color:var(--line-2);transition:text-decoration-color .16s}
.say a:hover{text-decoration-color:currentColor}
.say a.late{color:var(--red);text-decoration-color:oklch(0.82 0.09 27)}
.ctl{display:flex;align-items:center;gap:.5rem}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.5rem;align-items:start}
.stack{display:grid;gap:2.5rem;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--ink)}
h2{font-size:1.125rem;font-weight:800;letter-spacing:-.01em}
.sec-h .n{font-size:.875rem;font-weight:700;color:var(--ink-2)}
.sec-h .n.late{color:var(--red)}
.sec + .sec{margin-top:2.5rem}
.stack > .sec,.two > .sec{margin-top:0}

.row{display:flex;align-items:flex-start;gap:.75rem;padding:.6875rem 0;border-bottom:1px solid var(--line)}
.row .tm{flex:none;width:3.25rem;font-weight:700}
.row .tm.wide{width:3.75rem;color:var(--ink-2)}
.row .tm.ck{display:flex}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.row .m{display:flex;flex-wrap:wrap;align-items:center;gap:.125rem .75rem;font-size:.875rem;font-weight:500;color:var(--ink-2);margin-top:.125rem}
.row .late{color:var(--red);font-weight:700}
.row .must{color:var(--ink);font-weight:700}
.row.done .tm,.row.done b{color:var(--ink-3);font-weight:500}
.row.done label b{text-decoration:line-through;text-decoration-color:var(--line-2)}
.row.next{background:var(--go-bg);margin:0 -.75rem;padding-left:.75rem;padding-right:.75rem;border-radius:8px;border-bottom-color:transparent}
.row.next .st{color:var(--go);font-weight:700}
.row input[type=checkbox]{width:1.25rem;height:1.25rem;margin:.125rem 0 0;accent-color:var(--head);cursor:pointer;flex:none}
.row label{cursor:pointer}
.row > .ic{color:var(--ink-2);margin-top:.1875rem}
.row.ed{border-bottom:0;padding:.5rem 0}
.tag{display:inline-flex;align-items:center;gap:.375rem;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:.625rem;height:.625rem;border-radius:3px;background:var(--c)}
.empty{padding:1rem 0;color:var(--ink-2);font-size:.9375rem;font-weight:500;border-bottom:1px solid var(--line)}
.grp{font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:1rem 0 .3125rem;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:.375rem;flex:none;align-items:center}
.act,.keep{height:1.9375rem;font-size:.875rem;font-weight:700;color:var(--go);background:#fff;border:1px solid oklch(0.78 0.05 165);padding:0 .625rem;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background-color .16s}
.keep{padding:0 .25rem;max-width:5.25rem}
.act:hover,.keep:hover{background:var(--go-bg)}
.act:active{background:oklch(0.91 0.045 165)}
.icx{flex:none;width:2rem;height:2rem;display:inline-grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--ink-3);cursor:pointer;margin:-.125rem -.375rem 0 0;transition:background-color .16s,color .16s}
.icx:hover{background:var(--panel-2);color:var(--ink)}
.icx .i{width:1rem;height:1rem}
.lk{border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer;color:inherit;display:block;width:100%}
.lk:hover b{text-decoration:underline;text-underline-offset:.2em}
.addrow{display:flex;gap:.5rem;padding:.625rem 0 0}
.addrow input{flex:1;min-width:0}
/* 오늘 화면: 왼쪽 위 달력, 왼쪽 아래 일정·루틴, 오른쪽에 할 일. 좁은 화면에서는 달력 → 할 일 → 일정·루틴 순서. */
.view.t3{grid-template-columns:minmax(0,1fr) 29rem;grid-template-rows:auto 1fr;grid-template-areas:"top side" "under side";gap:2rem 2.5rem}
.t-top{grid-area:top;min-width:0}
.t-under{grid-area:under;min-width:0}
.view.t3 .side{grid-area:side}
.view.t3 .vh{margin-bottom:1.25rem}
/* 오늘 요약: 문장 대신 숫자로. 일정·할 일·밀린 일·루틴 */
.sum{display:flex;flex-wrap:wrap;gap:.375rem 1.75rem;margin-top:.625rem}
.sum a{display:flex;align-items:baseline;gap:.4375rem;border-radius:6px}
.sum span{font-size:.875rem;font-weight:600;color:var(--ink-2)}
.sum b{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.sum em{font-style:normal;font-size:.875rem;font-weight:600;color:var(--ink-2)}
.sum .late b,.sum .late span{color:var(--red)}
.sum .now em{color:var(--go);font-weight:700}
.tcal .cal-h{margin-bottom:.625rem}
.tcal .cal-h h2{font-size:1.25rem}
.tcal .big td{height:4.75rem}
.tcal .big td button{min-height:4.75rem;padding:.25rem .375rem}
.tcal .grid .d{width:1.5rem;height:1.5rem;font-size:.875rem}
.sec-h .n{margin-left:.375rem}
.sec-h h2 .n{font-weight:700}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-bottom:.375rem;border-bottom:2px solid var(--ink)}
.side-top .side-h{margin:0}
.side-top .n{font-size:.875rem;font-weight:700;color:var(--ink-2);margin-left:.5rem}
.daynote{font-size:.9375rem;font-weight:700;padding:.625rem 0 0}
/* 추가 줄은 평소에 한 줄만 보이고, 칸을 누르거나 글을 적으면 구분과 기한 단추가 펼쳐진다. */
.tadd{display:grid;gap:.5rem;padding:.75rem 0 .875rem;border-bottom:1px solid var(--line-2)}
.tadd-1{display:flex;gap:.375rem}
.tadd-1 input{flex:1;min-width:0}
.tadd-1 .btn-p{padding:0 .875rem}
.tadd-2{display:none;flex-wrap:wrap;align-items:center;gap:.5rem .625rem}
.tadd:focus-within .tadd-2,.tadd.on .tadd-2{display:flex}
.tadd-2 .seg button{height:2rem;padding:0 .625rem}
/* 할 일 한 줄: 체크, 구분 점, 이름, 기한 */
#s-td .row{align-items:flex-start;gap:.625rem;padding:.5625rem 0}
#s-td .row .t{display:flex;align-items:flex-start;gap:.5rem}
.gd{flex:none;width:.5rem;height:.5rem;border-radius:50%;background:var(--c);margin-top:.5rem}
.dz{flex:none;font-size:.8125rem;font-weight:600;color:var(--ink-3);margin-top:.1875rem}
#s-td .row .icx{margin-top:-.1875rem}
@media (hover:hover){
  #s-td .row .icx{opacity:0;transition:opacity .16s}
  #s-td .row:hover .icx,#s-td .row:focus-within .icx{opacity:1}
}
.duec{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem}
.duec .lab{font-size:.875rem;font-weight:700;color:var(--ink-2);margin-right:.125rem}
.duec button,.duec .pk{display:inline-flex;align-items:center;height:2rem;padding:0 .75rem;border:1px solid var(--line-2);border-radius:999px;background:#fff;font-size:.875rem;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background-color .16s}
.duec button:hover,.duec .pk:hover{background:var(--panel-2)}
.duec button[aria-pressed=true],.duec .pk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.duec .pk{position:relative}
.duec .pk:focus-within{outline:2px solid var(--go);outline-offset:2px}
.duec .pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
/* 시간표: 왼쪽은 하루 시간표(일정·루틴 줄과 할 일 줄), 오른쪽은 가져올 할 일. 끌어다 놓거나, 고른 뒤 시간을 누른다. */
.view.pl3{grid-template-rows:auto 1fr;grid-template-areas:"top side" "under side";gap:0 3rem}
.view.pl3 .side{grid-area:side}
.view.pl3 .vh{margin-bottom:1rem}
.pl-day{display:flex;flex-wrap:wrap;gap:.25rem .75rem;font-size:.875rem;font-weight:600;color:var(--ink-2);margin-bottom:.75rem}
.pl-day .tip{color:var(--head)}
.pl-hd{display:grid;grid-template-columns:3rem 38fr 62fr;font-size:.8125rem;font-weight:700;color:var(--ink-2);padding:0 0 .375rem;border-bottom:2px solid var(--ink)}
.pl-hd span{padding-left:.5rem}
.pl{display:grid;grid-template-columns:3rem minmax(0,1fr)}
.pl-t span{display:block;height:3rem;font-size:.8125rem;font-weight:600;color:var(--ink-2);padding-top:.125rem}
.pl-c{position:relative;height:calc(18 * 3rem);border-left:1px solid var(--line);cursor:cell;background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 3rem)}
.pl-c::before{content:"";position:absolute;top:0;bottom:0;left:38%;border-left:1px dashed var(--line-2)}
.pl-c.drop{background-color:var(--go-bg)}
.pl-e{position:absolute;top:calc((var(--s) - 6) * 3rem + 1px);height:calc((var(--e) - var(--s)) * 3rem - 2px);min-height:1.5rem;padding:.1875rem .5rem;border-radius:6px;overflow:hidden;font-size:.875rem;line-height:1.35;text-align:left}
.pl-e b{font-weight:800;margin-right:.375rem;font-variant-numeric:tabular-nums}
.pl-e.ev,.pl-e.rt{left:3px;width:calc(38% - 6px);pointer-events:none}
.pl-e.ev{background:color-mix(in oklch,var(--c) 16%,white);border:1px solid color-mix(in oklch,var(--c) 45%,white);color:color-mix(in oklch,var(--c) 62%,black);font-weight:600}
.pl-e.rt{background:var(--panel);border:1px dashed var(--line-2);color:var(--ink-2);font-weight:600}
.pl-e.tk{left:calc(38% + 3px + var(--in,0rem));right:3px;display:flex;align-items:flex-start;gap:.4375rem;background:#fff;border:1.5px solid var(--head);font-weight:600;cursor:grab}
.pl-e.tk > div{flex:1;min-width:0}
/* 한 시간이 안 되는 칸은 한 줄로 두고 넘치면 말줄임 */
.pl-e.one,.pl-e.tk.one > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-e.tk input{width:1.125rem;height:1.125rem;margin:.0625rem 0 0;accent-color:var(--head);flex:none;cursor:pointer}
.pl-e.tk.sel{background:var(--go-bg);box-shadow:0 0 0 2px var(--head)}
.pl-e.tk.done{border-color:var(--line-2);color:var(--ink-3)}
.pl-e.tk.done span{text-decoration:line-through}
.pl-now{position:absolute;left:0;right:0;top:calc((var(--s) - 6) * 3rem);height:2px;background:var(--red);pointer-events:none;z-index:2}
.pl-src{cursor:pointer;flex-wrap:wrap;border-radius:6px}
.pl-src .t{display:flex;align-items:flex-start;gap:.5rem}
.pl-src .dz{margin-top:.125rem}
.pl-src.sel{background:#fff;margin:0 -.5rem;padding-left:.5rem;padding-right:.5rem;box-shadow:inset 0 0 0 2px var(--head)}
.hrs{flex-basis:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.25rem;margin-top:.5rem}
.hrs button{height:2.125rem;border:1px solid var(--line-2);border-radius:6px;background:#fff;font-size:.875rem;font-weight:700;color:var(--ink-2);cursor:pointer;transition:background-color .16s}
.hrs button:hover{background:var(--panel-2);color:var(--ink)}
.pl-mark{position:absolute;left:calc(38% + 3px);right:3px;top:calc((var(--s) - 6) * 3rem + 1px);height:calc((var(--e) - var(--s)) * 3rem - 2px);border-radius:6px;background:var(--go-bg);box-shadow:inset 0 0 0 2px var(--head);pointer-events:none}
.pl-c{-webkit-user-select:none;user-select:none}
/* 아이폰 알람처럼 시와 분을 따로 굴려서 고르는 휠. 가운데 줄에 온 숫자가 고른 값이다. */
.pl-rng{display:flex;align-items:flex-end;gap:.5rem}
.pl-rng > span{align-self:center;margin-top:1.25rem;font-weight:700;color:var(--ink-2)}

<script>
(()=>{
'use strict';
const QS=new URLSearchParams(location.search);
const KEY='harupan.v1'+(QS.get('test')?'.test.'+QS.get('test'):'');
const FAKE=QS.get('now')?new Date(QS.get('now')):null;
const WD=['일','월','화','수','목','금','토'];
const PAL={blue:'파랑',orange:'주황',plum:'자주',teal:'청록',olive:'연두',slate:'회색'};
const KIND={link:'링크',note:'메모',file:'파일'};
const H0=6,H1=24;
const HOL26={'01-01':'신정','02-16':'설날 연휴','02-17':'설날','02-18':'설날 연휴','03-01':'삼일절','03-02':'대체공휴일','05-05':'어린이날','05-24':'부처님오신날','05-25':'대체공휴일','06-06':'현충일','08-15':'광복절','08-17':'대체공휴일','09-24':'추석 연휴','09-25':'추석','09-26':'추석 연휴','10-03':'개천절','10-05':'대체공휴일','10-09':'한글날','12-25':'성탄절'};
const HOLF={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const now=()=>FAKE?new Date(FAKE):new Date();
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const valid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(pd(s))===s;
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>pd(s).getDay();
const today=()=>ymd(now());
const nowH=()=>{const d=now();return d.getHours()+d.getMinutes()/60};
const md=s=>{const d=pd(s);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const mdw=s=>`${md(s)} ${WD[dow(s)]}요일`;
const wk0=s=>add(s,-dow(s));
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const hm=t=>{const a=t.split(':').map(Number);return a[0]+a[1]/60};
const t12=t=>{const a=t.split(':').map(Number);return `${a[0]<12?'오전':'오후'} ${a[0]%12||12}시${a[1]?` ${a[1]}분`:''}`};
const mAdd=(ym,n)=>{const a=ym.split('-').map(Number),d=new Date(a[0],a[1]-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const mTitle=ym=>`${+ym.slice(0,4)}년 ${+ym.slice(5)}월`;
const hol=s=>(s.slice(0,4)==='2026'?HOL26:HOLF)[s.slice(5)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const josa=(w,a,b)=>{const ch=w.charCodeAt(w.length-1);if(ch>=0xAC00&&ch<=0xD7A3)return (ch-0xAC00)%28?a:b;if(/\d$/.test(w))return '013678'.includes(w.slice(-1))?a:b;return a};
const wLabel=w=>{const s=w.join('');return s==='1111111'?'매일':s==='0111110'?'평일':s==='1000001'?'주말':WD.filter((x,i)=>w[i]).join('·')};
const ico=(k,c='ic')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${k}"/></svg>`;
const kindOf=u=>/drive\.google|docs\.google|\.(pdf|xlsx?|docx?|pptx?|hwpx?|zip|dwg)(\?|#|$)/i.test(u)?'file':'link';

const DEF_CATS=[{id:'work',n:'업무',col:'blue'},{id:'biz',n:'창업',col:'orange'},{id:'home',n:'집',col:'plum'},{id:'study',n:'공부',col:'teal'}];
const blank=()=>({v:1,cats:JSON.parse(JSON.stringify(DEF_CATS)),ev:[],td:[],rt:[],it:[],memo:{},fold:[],cfg:{},demo:false});
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return Object.assign(blank(),o)}}catch(e){}return blank()}
let S=load(),canSave=true,savedAt=null;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));savedAt=now();canSave=true}catch(e){canSave=false}}
function save(){saveLocal();queue()}
try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t')}catch(e){canSave=false}
/* ---------- 구글 시트 연결 ----------
   SYNC_URL이 비어 있으면 이 기기에만 저장한다. 주소가 있으면 입장 비밀번호를 넣은 기기만 시트의 내용을 읽고 쓴다.
   합치기: 마지막으로 시트와 맞춘 사본(base)과 비교해서, 이 기기에서 안 고친 것은 시트 쪽을 따르고 고친 것은 이 기기 것을 남긴다. */
const SYNC_URL='https://script.google.com/macros/s/AKfycbxHfI8VXHkirmiBD9EHXlL-XaDfz_IqsiaKMVj-3GpIEV41Pq3PcwpxiXVdTXtOxx0Hfg/exec';
const SURL=QS.get('test')?(QS.get('sync')||''):SYNC_URL;
const KK=KEY+'.key',KB=KEY+'.base',KM=KEY+'.meta';
const RELOCK=QS.get('test')&&QS.get('relock')?+QS.get('relock'):180000;
const SY={on:!!SURL,key:'',tk:false,at:0,dirty:false,busy:false,err:'',t:null};
/* 비밀번호는 기기에 남기지 않는다. 화면을 열 때마다 다시 묻고, 열려 있는 동안만 기억한다. */
try{localStorage.removeItem(KK);const m=JSON.parse(localStorage.getItem(KM)||'{}');SY.at=m.at||0;SY.dirty=!!m.dirty}catch(e){}
const J=x=>x===undefined?'':JSON.stringify(x);
const pick3=(b,l,r)=>J(l)===J(b)?r:l;
function mergeList(b,l,r,k){
  const bm=new Map(b.map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),out=[],seen=new Set();
  const one=id=>{
    const B=bm.get(id),L=lm.get(id),R=rm.get(id);
    if(J(L)===J(B))return R;
    if(J(R)===J(B))return L;
    if(L===undefined)return R;
    if(R===undefined)return L;
    if(k==='rt'){const m=JSON.parse(JSON.stringify(L));m.log={};new Set([...Object.keys(B&&B.log||{}),...Object.keys(L.log||{}),...Object.keys(R.log||{})]).forEach(d=>{if(pick3(B&&B.log&&B.log[d],L.log&&L.log[d],R.log&&R.log[d]))m.log[d]=1});return m}
    return L;
  };
  l.forEach(x=>{seen.add(x.id);const v=one(x.id);if(v)out.push(v)});
  r.forEach(x=>{if(seen.has(x.id))return;seen.add(x.id);const v=one(x.id);if(v)out.push(v)});
  return out;
}
function merge3(b,l,r){
  const o=blank();
  ['cats','ev','td','rt','it','fold'].forEach(k=>{o[k]=mergeList(b[k]||[],l[k]||[],r[k]||[],k)});
  o.memo={};
  new Set([...Object.keys(b.memo||{}),...Object.keys(l.memo||{}),...Object.keys(r.memo||{})]).forEach(k=>{const v=pick3((b.memo||{})[k],(l.memo||{})[k],(r.memo||{})[k]);if(v!==undefined)o.memo[k]=v});
  o.demo=!!pick3(b.demo,l.demo,r.demo);
  const nt=pick3((b.cfg||{}).nt,(l.cfg||{}).nt,(r.cfg||{}).nt);if(nt)o.cfg.nt=nt;

/* 시간표: 고른 날(U.sel)의 일정·루틴을 왼쪽 줄에, 시간을 정한 할 일(due가 그날이고 tm이 있는 것)을 오른쪽 줄에 놓는다. */
const lenTxt=n=>n%60===0?`${n/60}시간`:n<60?`${n}분`:`${Math.floor(n/60)}시간 ${n%60}분`;
const hmAdd=(t,n)=>{const m=Math.min(24*60,Math.round(hm(t)*60)+n);return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
const hmS=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const WT={};
/* 시·분 휠 하나(k: from·to = 고르는 창의 시작·끝, bs·be = 놓인 할 일의 시작·끝). 분은 1분 단위. */
function wheel(k,t,h0,h1,label){
  const h=+t.slice(0,2),m=+t.slice(3,5);
  let hs='',ms='';
  for(let i=h0;i<=h1;i++)hs+=`<div class="wi${i===h?' on':''}" data-a="whl-pick" data-i="${i-h0}">${pad(i)}</div>`;
  for(let i=0;i<60;i++)ms+=`<div class="wi${i===m?' on':''}" data-a="whl-pick" data-i="${i}">${pad(i)}</div>`;
  return `<div class="whl" data-k="${k}" data-h0="${h0}"><span class="whl-l">${label}</span><div class="whl-w"><div class="wcol" id="w-${k}-h" data-u="h" data-i="${h-h0}" tabindex="0" aria-label="${label} 시">${hs}</div><span class="wsep">:</span><div class="wcol" id="w-${k}-m" data-u="m" data-i="${m}" tabindex="0" aria-label="${label} 분">${ms}</div></div></div>`;
}
/* 다시 그린 뒤 휠을 고른 값 자리로 돌려놓는다. */
function wheelSync(){$$('.wcol').forEach(c=>{const h=c.firstElementChild?c.firstElementChild.offsetHeight:40;c.scrollTop=(+c.dataset.i)*h})}
/* 휠이 멈추면(같은 묶음의 두 휠 모두) 값을 반영한다. */
function whlSettle(g){
  if(!g||!document.body.contains(g))return;
  const k=g.dataset.k,hc=g.querySelector('.wcol[data-u=h]'),mc=g.querySelector('.wcol[data-u=m]');
  whlSet(k,Math.min(24*60,(+g.dataset.h0+ +hc.dataset.i)*60+ +mc.dataset.i));
}
function whlSet(k,mins){
  if(k==='from'||k==='to'){
    if(!U.pl.at)return;
    const f=toMin(U.pl.at),t=U.pl.to?toMin(U.pl.to):f+60;
    if(k==='from'){mins=Math.min(mins,24*60-1);if(mins===f)return;U.pl.at=hmS(mins);U.pl.to=hmS(Math.min(24*60,mins+Math.max(1,t-f)))}
    else{mins=Math.max(f+1,mins);if(mins===t&&U.pl.to)return;U.pl.to=hmS(mins)}
  }else{
    const p=S.td.find(x=>x.id===U.pl.pick);if(!p||!p.tm)return;
    const s=toMin(p.tm),len=p.tl||60;
    if(k==='bs'){mins=Math.min(mins,24*60-5);if(mins===s)return;p.tm=hmS(mins);if(mins+len>24*60)p.tl=24*60-mins}
    else{mins=Math.max(s+5,mins);if(mins===s+len)return;p.tl=mins-s}
    save();
  }
  render();
}

}
function lockSec(){

      ${rec?'<p class="note on"><i></i>이 기기는 얼굴·지문으로 엽니다</p>':can?'<p class="note">켜 두면 이 기기에서는 비밀번호 대신 얼굴이나 지문으로 엽니다. 비밀번호는 기기에 남기지 않습니다.</p>':'<p class="note">이 브라우저는 얼굴·지문 열기를 쓸 수 없어 비밀번호로만 엽니다.</p>'}

      <div class="btns" style="margin-bottom:.75rem"><button class="btn-o" type="button" data-a="sync-now">지금 다시 불러오기</button></div>`:'<p class="note">지금은 이 기기의 이 브라우저에만 저장됩니다. 다른 기기에서는 보이지 않고, 브라우저 기록을 지우면 함께 지워집니다. 가끔 백업 파일을 받아 두세요.</p>'}

  </div>`;

/* ---------- 그리기 ---------- */
function fkey(el){if(!el||el===document.body)return null;if(el.id)return '#'+el.id;const d=el.dataset||{};if(!d.a)return null;return `[data-a="${d.a}"]`+(d.id?`[data-id="${d.id}"]`:'')+(d.d?`[data-d="${d.d}"]`:'')+(d.v?`[data-v="${d.v}"]`:'')}
function render(o={}){
  const T=today(),v=$('#view'),keep=o.focus||fkey(document.activeElement);

  if(U.fc!=='all'&&!cat(U.fc)){U.fc='all';U.ff='all'}
  if(U.ff!=='all'&&U.ff!==''&&!fold(U.ff))U.ff='all';
  v.className='view'+(U.view==='set'?' one':U.view==='box'?' full':U.view==='today'?' t3':U.view==='plan'?' pl3':'');
  v.innerHTML=V[U.view]();
  wheelSync();
  $$('.tabs a').forEach(a=>{if(a.dataset.v===U.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const rc=rtCount(),nr=$('#n-rt'),nb=$('#n-box'),inb=inbox().length;
  nr.hidden=!rc.due;nr.textContent=rc.done+'/'+rc.due;nb.hidden=!inb;nb.textContent=inb;
  $('#banner').innerHTML=(canSave?'':'<div class="banner warn"><span>이 창에서는 적은 내용이 저장되지 않습니다. 미리 보기 창이나 사생활 보호 창 말고, 크롬이나 엣지에서 이 파일을 열어 주세요.</span></div>')+(S.demo?'<div class="banner"><span>지금 보이는 것은 예시입니다. 둘러본 뒤 지우고 내 것으로 시작하세요.</span><button class="act" type="button" data-a="demo-del">예시 지우기</button></div>':'');

  status();
  if(keep&&keep!=='#q'){const el=$(keep);if(el&&el.focus)el.focus({preventScroll:!o.focus})}
  U.day=T;U.min=now().getMinutes();
}
function narrow(){return window.matchMedia('(max-width:1100px)').matches}
function reveal(sel){if(narrow()){const el=$(sel);if(el)el.scrollIntoView({block:'start',behavior:'auto'})}}
const VIEWS=['today','plan','cal','routine','box','review','set'];
function route(){
  const v=location.hash.slice(1);
  if(VIEWS.includes(v)){if(U.view!==v){U.view=v;U.tdEdit=null;window.scrollTo(0,0)}render()}
  else{if(!v)U.view='today';if(!v||!$('#view').firstChild)render()}
}
function go(v){
  if(U.view!==v){U.view=v;U.tdEdit=null;U.tdDue=null;U.pl.pick=U.pl.at=null;if(U.f.ev.id)U.f.ev=evBlank(U.sel);try{history.pushState(null,'','#'+v)}catch(e){}window.scrollTo(0,0);if(v==='set')ntRefresh()}
  render();
}

/* ---------- 폼 읽기 ---------- */
function syncEv(){const f=U.f.ev,g=id=>$(id);if(!g('#ev-n'))return;f.n=g('#ev-n').value;f.d=valid(g('#ev-d').value)?g('#ev-d').value:f.d;if(g('#ev-t')){f.t=g('#ev-t').value||f.t;f.e=g('#ev-e').value}f.g=g('#ev-g').value;f.r=g('#ev-r').value}
function syncRt(){const f=U.f.rt;if(!$('#rt-n'))return;f.n=$('#rt-n').value;if($('#rt-t'))f.t=$('#rt-t').value||f.t}

/* ---------- 시간표에 넣기 ---------- */
function slotTime(col,y){const r=col.getBoundingClientRect(),h=Math.min(H1-.5,Math.max(H0,H0+Math.floor((y-r.top)/r.height*(H1-H0)*2)/2));return `${pad(Math.floor(h))}:${h%1?'30':'00'}`}
/* 시간 범위를 잡고 고르는 창을 연다. 구분은 위에서 고른 것을 따르고, 전체면 업무(업무가 비었으면 개인)부터. */
function plOpen(from,to){
  const cand=S.td.filter(t=>!t.done&&!(t.due===U.sel&&t.tm));
  U.pl.pick=null;U.pl.at=from;U.pl.to=to;U.pl.chk=[];U.pl.nw='';
  U.pl.g=U.tg!=='all'?U.tg:!cand.some(t=>tg(t)==='w')&&cand.some(t=>tg(t)==='p')?'p':'w';
  render();
  /* 폰은 창이 아래에서 올라오므로, 잡은 칸이 창에 가리면 위로 올려 보이게 한다. */
  if(window.matchMedia('(max-width:760px)').matches){const m=$('.pl-mark'),p=$('#pl-pop');if(m&&p){const r=m.getBoundingClientRect(),top=p.getBoundingClientRect().top;if(r.bottom>top-8||r.top<90)window.scrollBy(0,r.top-96)}}
}
function plCount(){const b=$('#pl-go');if(!b)return;const n=U.pl.chk.length+(U.pl.nw.trim()?1:0);b.textContent=n?`${n}개 넣기`:'넣기'}
/* 고른 것(누른 순서대로)과 새로 적은 것을 범위 안에 차례로 놓는다. 하나면 범위 전체, 여럿이면 똑같이 나눈다(5분 단위). */
function plGo(){
  const d=U.sel,from=U.pl.at;if(!from)return;
  const to=U.pl.to&&hm(U.pl.to)>hm(from)?U.pl.to:hmAdd(from,60);
  const ids=U.pl.chk.filter(id=>S.td.some(t=>t.id===id)),nw=U.pl.nw.trim(),n=ids.length+(nw?1:0),g=U.pl.g;
  if(!n){const i=$('#pl-new');if(i)i.focus();toast('넣을 할 일을 고르거나 적어 주세요');return}
  const total=Math.round((hm(to)-hm(from))*60),len=n===1?total:Math.max(5,Math.floor(total/n/5)*5);
  U.pl.at=U.pl.to=null;U.pl.chk=[];U.pl.nw='';
  commit(`${d===today()?'오늘':md(d)} ${from}~${to}에 ${n===1?(nw||(S.td.find(t=>t.id===ids[0])||{}).n):n+'개를'} 넣었습니다`,()=>{
    let m=Math.round(hm(from)*60);
    ids.forEach(id=>{const t=S.td.find(x=>x.id===id);t.due=d;t.tm=hmS(m);t.tl=len;m+=len});
    if(nw)S.td.push({id:uid(),n:nw,c:'',g,due:d,done:'',at:today(),tm:hmS(m),tl:len});
  });
}
function plPlace(id,tm){
  const t=S.td.find(x=>x.id===id);if(!t)return;
  const d=U.sel,moved=t.due===d&&t.tm;U.pl.pick=U.pl.at=null;
  commit(`${d===today()?'오늘':md(d)} ${tm}${moved?'으로 옮겼습니다':'에 넣었습니다'} · ${t.n}`,()=>{t.due=d;t.tm=tm;if(!t.tl)t.tl=60});
}

/* ---------- 누르기 ---------- */
const A={
  undo(){if(!undoSnap)return;S=JSON.parse(undoSnap);undoSnap=null;save();U.tdEdit=null;U.f.ev=evBlank(U.sel);U.f.rt=rtBlank();if(!S.it.find(x=>x.id===U.itSel))U.itSel=null;render();toast('되돌렸습니다')},
  alt(){const f=altFn;altFn=null;$('#toast').hidden=true;if(f)f()},
  day(el){syncEv();U.sel=el.dataset.d;if(!U.f.ev.id)U.f.ev.d=U.sel;render()},
  'cal-prev'(){syncEv();if(U.view==='cal'&&U.mode==='week'){U.sel=add(U.sel,-7);U.cur=U.sel.slice(0,7);if(!U.f.ev.id)U.f.ev.d=U.sel}else U.cur=mAdd(U.cur,-1);render()},
  'cal-next'(){syncEv();if(U.view==='cal'&&U.mode==='week'){U.sel=add(U.sel,7);U.cur=U.sel.slice(0,7);if(!U.f.ev.id)U.f.ev.d=U.sel}else U.cur=mAdd(U.cur,1);render()},
  'cal-today'(){syncEv();U.sel=today();U.cur=U.sel.slice(0,7);U.pl.pick=U.pl.at=null;if(!U.f.ev.id)U.f.ev.d=U.sel;render()},
  mode(el){syncEv();U.mode=el.dataset.v;if(U.mode==='week')U.cur=U.sel.slice(0,7);else U.cur=U.sel.slice(0,7);render()},
  slot(el,ev){syncEv();const r=el.getBoundingClientRect(),h=Math.min(H1-.5,H0+Math.floor((ev.clientY-r.top)/r.height*(H1-H0)*2)/2);
    U.sel=el.dataset.d;if(!U.f.ev.id){U.f.ev.d=U.sel;U.f.ev.timed=true;U.f.ev.t=`${pad(Math.floor(h))}:${h%1?'30':'00'}`;U.f.ev.e=''}
    render({focus:'#ev-n'});reveal('#ev-form')},
  'ev-edit'(el){const e=S.ev.find(x=>x.id===el.dataset.id);if(!e)return;U.f.ev={id:e.id,n:e.n,d:e.d,timed:!!e.t,t:e.t||'09:00',e:e.e||'',c:e.c||'',g:tg(e),r:e.r||''};if(!e.r){U.sel=e.d;U.cur=e.d.slice(0,7)}
    render({focus:'#ev-n'});if(U.view==='cal')reveal('#ev-form')},
  'ev-timed'(el){syncEv();U.f.ev.timed=el.dataset.v==='1';render()},
  'ev-cancel'(){U.f.ev=evBlank(U.sel);render()},
  'ev-del'(el){const e=S.ev.find(x=>x.id===el.dataset.id);if(!e)return;U.f.ev=evBlank(U.sel);commit(`"${e.n}" 일정을 지웠습니다${e.r?" (매주 반복 전체)":""}`,()=>{S.ev=S.ev.filter(x=>x.id!==e.id)})},
  tg(el){syncEv();const a=$('#td-add');if(a)U.ta.n=a.value;U.tg=el.dataset.v;if(U.tg!=='all')U.ta.g=U.tg;U.tdEdit=null;U.tdDue=null;render()},
  tga(el){const a=$('#td-add');if(a)U.ta.n=a.value;U.ta.g=el.dataset.v;if(U.tg!=='all')U.tg=U.ta.g;render({focus:'#td-add'})},
  'ta-due'(el){const a=$('#td-add');if(a)U.ta.n=a.value;U.ta.due=dueVal(el);render({focus:'#td-add'})},
  'td-duepick'(el){U.tdDue=U.tdDue===el.dataset.id?null:el.dataset.id;U.tdEdit=null;render()},
  'td-setdue'(el){const t=S.td.find(x=>x.id===el.dataset.id);if(!t)return;const v=dueVal(el);U.tdDue=null;if(v===(t.due||'')){render();return}
    commit(`"${t.n}" 기한: ${v?dueLabel(v)+'까지':'없음'}`,()=>{t.due=v;if(!v)t.tm=''})},
  'pl-pick'(el){U.pl.pick=U.pl.pick===el.dataset.id?null:el.dataset.id;U.pl.at=null;render()},
  'pl-blk'(el){U.pl.pick=U.pl.pick===el.dataset.id?null:el.dataset.id;U.pl.at=null;render()},
  'pl-at'(el){plPlace(el.dataset.id,el.dataset.v)},
  'pl-slot'(el,ev){if(Date.now()-U.pl.dragEnd<400)return;const tm=slotTime(el,ev.clientY);if(U.pl.pick){plPlace(U.pl.pick,tm);return}if(U.pl.at===tm){A['pl-atx']();return}plOpen(tm,hmAdd(tm,60))},
  'pl-atx'(){U.pl.at=U.pl.to=null;U.pl.chk=[];U.pl.nw='';render()},
  'whl-pick'(el){const c=el.parentElement,g=el.closest('.whl');c.dataset.i=el.dataset.i;if(g){clearTimeout(WT[g.dataset.k]);whlSettle(g)}},
  'pl-g'(el){U.pl.g=el.dataset.v==='p'?'p':'w';render()},
  'pl-chk'(el){const id=el.dataset.id;U.pl.chk=el.checked?U.pl.chk.filter(x=>x!==id).concat(id):U.pl.chk.filter(x=>x!==id);plCount()},
  'pl-nop'(){},
  'pl-len'(el){const t=S.td.find(x=>x.id===el.dataset.id);if(!t)return;t.tl=+el.dataset.v||60;save();render()},
  'pl-out'(el){const t=S.td.find(x=>x.id===el.dataset.id);if(!t)return;U.pl.pick=null;commit(`시간표에서 뺐습니다 · ${t.n}`,()=>{t.tm=''})},
  'pl-prev'(){U.sel=add(U.sel,-1);U.cur=U.sel.slice(0,7);U.pl.pick=U.pl.at=null;if(!U.f.ev.id)U.f.ev.d=U.sel;render()},
  'pl-next'(){U.sel=add(U.sel,1);U.cur=U.sel.slice(0,7);U.pl.pick=U.pl.at=null;if(!U.f.ev.id)U.f.ev.d=U.sel;render()},

  'td-today'(el){const t=S.td.find(x=>x.id===el.dataset.id);if(!t)return;commit('오늘 할 일로 옮겼습니다',()=>{t.due=today()})},

  'td-cancel'(){U.tdEdit=null;render()},
  'td-del'(el){const t=S.td.find(x=>x.id===el.dataset.id);if(!t)return;U.tdEdit=null;commit(`"${t.n}"${josa(t.n,'을','를')} 지웠습니다`,()=>{S.td=S.td.filter(x=>x.id!==t.id)})},
  'rt-toggle'(el){const r=S.rt.find(x=>x.id===el.dataset.id);if(!r)return;const d=el.dataset.d||today();if(r.log[d])delete r.log[d];else r.log[d]=1;save();render()},
  'rt-edit'(el){const r=S.rt.find(x=>x.id===el.dataset.id);if(!r)return;U.f.rt={id:r.id,n:r.n,timed:!!r.t,t:r.t||'07:00',w:r.w.slice(),mode:r.k?'count':'days',k:r.k||3};render({focus:'#rt-n'});reveal('#rt-form')},
  'rt-mode'(el){syncRt();U.f.rt.mode=el.dataset.v;render()},

  'rt-pre'(el){syncRt();U.f.rt.w={all:[1,1,1,1,1,1,1],wd:[0,1,1,1,1,1,0],we:[1,0,0,0,0,0,1]}[el.dataset.v].slice();render()},
  'rt-day'(el){syncRt();const i=+el.dataset.v;U.f.rt.w[i]=U.f.rt.w[i]?0:1;render()},
  'rt-cancel'(){U.f.rt=rtBlank();render()},
  'rt-del'(el){const r=S.rt.find(x=>x.id===el.dataset.id);if(!r)return;U.f.rt=rtBlank();commit(`"${r.n}" 루틴을 지웠습니다`,()=>{S.rt=S.rt.filter(x=>x.id!==r.id)})},
  'it-keep'(el){const x=S.it.find(y=>y.id===el.dataset.id),v=el.value.split('/'),c=cat(v[0]),f=fold(v[1]);if(!x||!c)return;commit(`"${x.n}"${josa(x.n,'을','를')} ${c.n}${f?' › '+f.n:''}에 보관했습니다`,()=>{x.c=c.id;x.f=f?f.id:''})},
  'it-todo'(el){const x=S.it.find(y=>y.id===el.dataset.id);if(!x)return;if(U.itSel===x.id)U.itSel=null;commit('할 일로 옮겼습니다',()=>{S.it=S.it.filter(y=>y.id!==x.id);S.td.push({id:uid(),n:x.b||x.n,c:'',g:U.ta.g,due:'',done:'',at:today()})})},
  'it-sel'(el){dlgOpen(el.dataset.id)},
  'it-new'(){dlgOpen(null,U.view==='box'&&cat(U.fc)?{c:U.fc,f:fold(U.ff)?U.ff:''}:null)},
  'dlg-close'(){dlgClose(false)},
  'dlg-drop'(){dlgClose(true)},
  'dlg-keep'(){U.d.ask=false;$('#d-foot').innerHTML=dlgFoot();$('#d-b').focus()},
  'dlg-del'(){const x=S.it.find(y=>y.id===U.d.id);if(!x)return;dlgClose(true);U.itSel=null;commit(`"${x.n}"${josa(x.n,'을','를')} 지웠습니다`,()=>{S.it=S.it.filter(y=>y.id!==x.id)})},
